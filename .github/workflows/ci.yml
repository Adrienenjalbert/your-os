name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Verify README is in sync with packages/
        run: pnpm run check:readme
      - name: Verify architecture diagram matches workspace
        run: pnpm run check:architecture

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  brand-lint-byte-equivalence:
    # Required status check. Guards the Phase 1 extraction promise:
    # @your-os/brand-lint must produce byte-identical output to Career Hub's
    # baseline. If this fails, do NOT merge — Career Hub's brand:lint will
    # diverge in production.
    name: brand-lint byte-equivalence (REQUIRED)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `...` includes upstream workspace dependencies (e.g. @your-os/tenant-config)
      # so tsup's dts generation can resolve their type declarations.
      - run: pnpm --filter "@your-os/brand-lint..." build
      - name: Run byte-equivalence test against Career Hub fixture
        run: pnpm --filter @your-os/example-career-hub-snapshot test --run brand-lint

  changeset-check:
    name: Changeset present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify changeset for package changes
        run: |
          if git diff --name-only origin/main...HEAD | grep -E '^packages/' >/dev/null; then
            if ! ls .changeset/*.md 2>/dev/null | grep -v README.md >/dev/null; then
              echo "::error::Package files changed but no changeset added. Run 'pnpm changeset' and commit the result."
              exit 1
            fi
          fi
